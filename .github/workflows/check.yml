name: Comprobación HTML y JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JS
        run: |
          node --check js/app.js
          node --check js/config.js
      - name: Verificar archivos esenciales
        run: |
          test -s index.html
          test -s css/styles.css
          test -s supabase/schema.sql
