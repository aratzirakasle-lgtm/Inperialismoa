name: Comprobación HTML y JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JS y scripts de las pantallas
        run: |
          for file in js/*.js js/*.mjs; do node --check "$file" || exit 1; done
          node tests/check-html-scripts.mjs
      - name: Probar permisos e ilustraciones de los ejercicios
        run: node --test tests/*.test.mjs
      - name: Verificar archivos esenciales
        run: |
          test -s index.html
          test -s css/styles.css
          test -s supabase/schema.sql
          test -s supabase/mission2_faktoreak.sql
          test -s inperialismoaren-faktoreak.html
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para las pruebas
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Comprobar alumnos y profesorado con navegador (Supabase simulado)
        env:
          SMOKE_USE_CHROME: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/inperialismoa-server.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/mission1-classroom-browser.mjs
          node tests/mission2-browser-smoke.mjs
      - name: Comprobar atlas de la misión 3 por separado
        if: always()
        env:
          SMOKE_USE_CHROME: '1'
        run: |
          curl -fsS http://127.0.0.1:8765/ >/dev/null || (python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/inperialismoa-atlas-server.log 2>&1 & sleep 1)
          node tests/m3-atlas-browser.mjs
      - name: Guardar capturas históricas de los cinco ejercicios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mision2-cinco-ejercicios-vista-previa
          path: |
            test-output/m1-*.png
            test-output/m1-auditoria-*.json
            test-output/m2-*.png
            test-output/m3-atlas-*.png
            test-output/c-museo-*.png
          if-no-files-found: ignore
  enigma-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar lógica y once recursos HD
        run: node --test tests/m3-enigma.test.mjs
      - name: Instalar navegador para las pruebas
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Comprobar el ejercicio completo con navegador
        if: always()
        env:
          SMOKE_USE_CHROME: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/enigma89-server.log 2>&1 &
          sleep 1
          node tests/m3-enigma-browser.mjs
      - name: Guardar capturas reales del ejercicio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enigma93-capturas-navegador
          path: test-output/m3-enigma-*.png
          if-no-files-found: error
