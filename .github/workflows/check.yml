name: Comprobación HTML y JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JS y scripts de las pantallas
        run: |
          for file in js/*.js; do node --check "$file"; done
          node tests/check-html-scripts.mjs
      - name: Probar separación de acceso alumno/profesor
        run: node --test tests/mission1-access.test.mjs
      - name: Verificar archivos esenciales
        run: |
          test -s index.html
          test -s css/styles.css
          test -s supabase/schema.sql
