name: Restaurar iconos originales de la maleta
on:
  push:
    branches: [feature/mision2-factores-5-ejercicios]
    paths: [scripts/recover-m2-original-icons.py]
permissions:
  contents: write
jobs:
  restore-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install pillow
      - run: python scripts/recover-m2-original-icons.py
      - name: Subir imágenes restauradas a la rama (no a producción)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/m2-vintage-*-transparent.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(m2): rescatar los 8 motivos antiguos con transparencia"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maleta-motivos-antiguos-transparentes
          path: assets/m2-vintage-*-transparent.webp
