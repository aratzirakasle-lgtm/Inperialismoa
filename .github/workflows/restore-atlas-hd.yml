name: Restaurar imágenes nativas del atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/restore-atlas-hd.py'
      - '.github/workflows/restore-atlas-hd.yml'
permissions:
  contents: write
concurrency:
  group: atlas-native-art
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar tratamiento de imágenes
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Recuperar imágenes y comprobar referencias
        run: |
          python scripts/restore-atlas-hd.py
          node --check js/museum-passport.js
          node --check js/museum-expedition.js
          node --check js/app.js
          node --test tests/museum-passport.test.mjs tests/museum-expedition.test.mjs tests/museum-expedition-concept.test.mjs tests/resource-paths.test.mjs
      - name: Publicar imágenes y enlaces de forma atómica
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/atlas-*-hd.webp assets/atlas-mission-hd-*.webp assets/museum-expedition.css js/museum-passport.js js/museum-expedition.js js/app.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore atlas artwork at native resolution and use larger mission illustrations"
            git push
          fi
