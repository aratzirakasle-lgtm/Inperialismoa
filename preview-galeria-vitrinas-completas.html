 <style>
  #preview-health{position:fixed;z-index:9999;right:12px;bottom:12px;max-width:min(92vw,420px);padding:9px 14px;color:#f5e3bf;background:#0a281fef;border:1px solid #cfaa69;box-shadow:0 6px 24px #0008;border-radius:5px;font:600 12px/1.4 system-ui,sans-serif;pointer-events:none}
  #preview-health span{color:#d9b56d}
  @media print{#preview-health{display:none}}
 </style>
</head>
<body>
<div id="app-shell" class="app-shell gallery-active">
 <div class="layout"><main class="main-content" id="main-content"><div id="view"></div></main></div>
</div>
<footer id="preview-health" aria-live="polite" lang="eu">Egiaztatzen…</footer>
<script type="module">
import { mountGallery } from './js/galeria-potencias.js?v=20261123-fluidez1';
const root=document.getElementById('view');
mountGallery(root,{initial:{},preview:true,navigationEnabled:false,navigationPreview:true,
  canSkip:false,draftKey:null,dossierProgress:()=>0,
  onBack:()=>{},onContinue:()=>{},onSubmit:async()=>{throw Error('Aurrebista: ez dira datuak bidaltzen')}});
const status=document.getElementById('preview-health');
function inspect(){
 const areas=[...root.querySelectorAll('.gal-zone')];
 const cards=[...root.querySelectorAll('.gal-zone .gal-tile-placed')];
 const glass=[...root.querySelectorAll('.gal-vitrine')];
 const expected=[4,5,4,4,3];
 const full=root.querySelector('[data-gallery-action="preview-complete"][aria-pressed="true"]')!==null;
 const partial=root.querySelector('[data-gallery-action="preview-partial"][aria-pressed="true"]')!==null;
 const expectedCounts=full?expected:partial?[2,2,2,2,2]:null;
 const problems=[];
 const tolerance=2.5;
 const intersects=(a,b)=>Math.min(a.right,b.right)>Math.max(a.left,b.left)+tolerance&&Math.min(a.bottom,b.bottom)>Math.max(a.top,b.top)+tolerance;
 if(areas.length!==5||glass.length!==4)problems.push('Ez dira ageri 4 beirateak / 5 eremuak');
 if(expectedCounts&&cards.length!==expectedCounts.reduce((a,b)=>a+b,0))problems.push('Kartela kopurua desegokia');
 areas.forEach((zone,i)=>{
  const zoneCards=[...zone.querySelectorAll('.gal-tile-placed')];
  if(expectedCounts&&zoneCards.length!==expectedCounts[i])problems.push('Eremua '+(i+1)+': '+zoneCards.length+'/'+expectedCounts[i]);
  const z=zone.getBoundingClientRect();
  zoneCards.forEach((card,j)=>{
    const r=card.getBoundingClientRect();
    if(r.top<z.top-tolerance||r.left<z.left-tolerance||r.bottom>z.bottom+tolerance||r.right>z.right+tolerance)
      problems.push('Kartela eremutik kanpo: '+(i+1)+'-'+(j+1));
    const label=card.querySelector('.gal-tile-name');
    if(label&&(label.scrollHeight>label.clientHeight+3||label.scrollWidth>label.clientWidth+3)
      &&getComputedStyle(label).overflow!=='visible')
      problems.push('Testua moztuta: '+(i+1)+'-'+(j+1));
    for(let k=j+1;k<zoneCards.length;k++)
      if(intersects(r,zoneCards[k].getBoundingClientRect()))problems.push('Gainjarritako kartelak: '+(i+1));
  });
 });
 glass.forEach((caseEl,i)=>{
  const vitr=caseEl.getBoundingClientRect();
  for(const card of caseEl.querySelectorAll('.gal-tile-placed')){
   const r=card.getBoundingClientRect();
   if(r.bottom>vitr.bottom+tolerance||r.left<vitr.left-tolerance||r.right>vitr.right+tolerance)
     problems.push('Kartela beiratearen mugetatik kanpo: '+(i+1));
  }
 });
 if(document.documentElement.scrollWidth>window.innerWidth+8)
   problems.push('Pantailak desplazamendu horizontala dauka');
 const unique=[...new Set(problems)];
 status.textContent=(unique.length?'⚠ EGIAZTATU':'✓ ONDO')+
 ' · '+cards.length+' kartela · 4 beirate · '+areas.length+' eremu · '+
 window.innerWidth+' px · '+unique.length+' arazo'+(unique.length?' · '+unique.slice(0,2).join(' / '):'');
 status.dataset.overflow=String(unique.length);
 status.dataset.cardCount=String(cards.length);
 status.title=unique.join(' | ');
 status.style.borderColor=unique.length?'#f0b15e':'#b7a66c';
}
let pending=false;
new MutationObserver(()=>{
 if(pending)return;
 pending=true;
 requestAnimationFrame(()=>{pending=false;inspect()});
}).observe(root,{childList:true,subtree:true});
window.addEventListener('resize',inspect);
requestAnimationFrame(inspect);
const params=new URLSearchParams(location.search);
if(params.get('full')==='1')
 root.querySelector('[data-gallery-action="preview-complete"]')?.click();
else if(params.get('partial')==='1')
 root.querySelector('[data-gallery-action="preview-partial"]')?.click();

</script>
</body>
</html>
